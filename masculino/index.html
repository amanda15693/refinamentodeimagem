<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Teste de Assinatura de Estilo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: coluna única de leitura sobre fundo nude, com azul-marinho como destaque; etapas em sequência com régua de progresso no topo */
:root{
  --bg:#f7f2eb; --surface:#fffdf9; --ink:#1b2438; --muted:#6b6660; --line:#e6dccf;
  --accent:#1f2f4d; --accent-ink:#faf6f0; --accent-soft:#dde3ec;
  --st-n:#6f8455; --st-t:#34507a; --st-e:#9a8166; --st-r:#cf7f98; --st-s:#b1263a; --st-c:#d38d1f; --st-d:#2b2b2e;
  --f-display:"Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#f7f2eb; --surface:#fffdf9; --ink:#1b2438; --muted:#6b6660; --line:#e6dccf;
  --accent:#1f2f4d; --accent-ink:#faf6f0; --accent-soft:#dde3ec;
  --st-n:#6f8455; --st-t:#34507a; --st-e:#9a8166; --st-r:#cf7f98; --st-s:#b1263a; --st-c:#d38d1f; --st-d:#2b2b2e;
  color-scheme:light}}
:root[data-theme="dark"]{
  --bg:#f7f2eb; --surface:#fffdf9; --ink:#1b2438; --muted:#6b6660; --line:#e6dccf;
  --accent:#1f2f4d; --accent-ink:#faf6f0; --accent-soft:#dde3ec;
  --st-n:#6f8455; --st-t:#34507a; --st-e:#9a8166; --st-r:#cf7f98; --st-s:#b1263a; --st-c:#d38d1f; --st-d:#2b2b2e;
  color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:860px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:18px 12px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.35rem;font-weight:500;letter-spacing:.01em}
.brand i{color:var(--accent)}
.steplabel{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ruler{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:12px}
.ruler button{all:unset;cursor:pointer;height:6px;border-radius:3px;background:var(--line)}
.ruler button.done{background:var(--accent);opacity:.45}
.ruler button.cur{background:var(--accent)}
.ruler button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
main{padding-top:28px}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-weight:500;font-size:clamp(2rem,6vw,2.9rem);line-height:1.08;margin:.3rem 0 .6rem;text-wrap:balance}
h1 em{font-style:italic;color:var(--accent)}
h2{font-family:var(--f-display);font-weight:500;font-size:1.6rem;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:1.25rem;margin:0}
.lead{color:var(--muted);max-width:62ch;margin:0 0 8px}
.qlist{display:flex;flex-direction:column;gap:30px;margin-top:28px}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;font-weight:600;font-size:1.05rem;margin-bottom:12px;display:flex;gap:12px;align-items:baseline}
legend .qn{font-family:var(--f-mono);font-weight:400;font-size:.78rem;color:var(--muted);flex:none}
.hint{font-size:.85rem;color:var(--muted);margin:-6px 0 12px 0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .15s, background .15s;position:relative}
.opt:hover{border-color:var(--muted)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.let{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .let{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
/* alternativas visuais (cores, tecidos, estampas) */
.opts.tiles{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.opt.tile{flex-direction:column;padding:0;overflow:hidden;gap:0}
.opt.tile .vis{display:block;width:100%;height:104px;border-bottom:1px solid var(--line)}
.opt.tile .tx{display:flex;gap:10px;padding:10px 12px;align-items:flex-start;font-size:.92rem;line-height:1.4}
.opt.tile .vis.pal{display:grid;grid-template-columns:repeat(4,1fr)}
.vis.pal span{display:block}
.opt.tile .vis.duo{display:grid;grid-template-columns:1fr 1fr}
.vis.duo span{display:block}
.opt.tile .vis.photo-vis{height:auto;aspect-ratio:3/2;max-width:100%;background:#fff}
.vis.photo-vis img{width:100%;height:100%;object-fit:cover;display:block}
.fx-n{background-color:#d8c8a7;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(95,72,40,.2) 0 1px,transparent 1px 4px)}
.fx-t{background-color:#2c3a57;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.13) 0 2px,transparent 2px 6px)}
.fx-e{background:linear-gradient(115deg,#d6bf9b 0%,#f7ecd6 32%,#c6aa80 52%,#f2e4c9 74%,#cdb38e 100%)}
.fx-r{background-color:#f3d6de;background-image:radial-gradient(circle,transparent 5px,rgba(255,255,255,.95) 6px,rgba(255,255,255,.95) 7px,transparent 8px),radial-gradient(circle,rgba(255,255,255,.9) 1.5px,transparent 2px);background-size:18px 18px,9px 9px}
.fx-s{background:linear-gradient(160deg,#3a0b16 0%,#7d1a2c 40%,#c3586c 50%,#7d1a2c 62%,#2a0710 100%)}
.fx-c{background-image:conic-gradient(#e0662f 0 25%,#2f8c84 0 50%,#f1c84b 0 75%,#8c3fa2 0);background-size:44px 44px}
.fx-d{background:radial-gradient(circle at 30% 20%,#4c4c52,#0d0d0e 70%);box-shadow:inset 0 0 0 8px #0d0d0e,inset 0 0 0 9px rgba(255,255,255,.28)}
.pr-n{background-color:#f3ece0;background-image:linear-gradient(90deg,rgba(150,115,70,.35) 50%,transparent 50%),linear-gradient(rgba(150,115,70,.35) 50%,transparent 50%);background-size:20px 20px}
.pr-t{background:repeating-linear-gradient(90deg,#1f2f4d 0 6px,#f4f1ea 6px 17px)}
.pr-e{background-color:#efe8dd;background-image:radial-gradient(#8f7759 1px,transparent 1.6px);background-size:9px 9px}
.pr-r{background-color:#fbf0f2;background-image:radial-gradient(#e396ac 5px,transparent 5.6px),radial-gradient(#e396ac 5px,transparent 5.6px);background-size:26px 26px;background-position:0 0,13px 13px}
.pr-s{background-color:#d8a45c;background-image:radial-gradient(ellipse at center,#b67a36 32%,#2a1a0c 35% 56%,transparent 60%),radial-gradient(ellipse at center,#2a1a0c 40%,transparent 46%),radial-gradient(ellipse at center,#b67a36 30%,#2a1a0c 34% 55%,transparent 60%);background-size:30px 24px,14px 10px,26px 30px;background-position:0 0,17px 13px,9px 16px}
.pr-c{background-color:#f1c84b;background-image:linear-gradient(135deg,#2f8c84 25%,transparent 25%),linear-gradient(225deg,#2f8c84 25%,transparent 25%),linear-gradient(315deg,#e0662f 25%,transparent 25%),linear-gradient(45deg,#e0662f 25%,transparent 25%);background-size:26px 26px;background-position:-13px 0,-13px 0,0 0,0 0}
.pr-d{background:conic-gradient(from 45deg,#0f0f10 0 25%,#f6f5f2 0 50%,#0f0f10 0 75%,#f6f5f2 0);background-size:64px 64px}
/* tabela de adjetivos */
.adj{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.adj label{display:grid;place-items:center;text-align:center;min-height:52px;padding:8px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer;font-size:.9rem;line-height:1.2}
.adj label:nth-child(7n){border-right:0}
.adj label:nth-last-child(-n+7){border-bottom:0}
.adj input{position:absolute;opacity:0;pointer-events:none}
.adj label.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.adj label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-3px}
textarea,input[type=text],input[type=date]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
textarea{min-height:92px;resize:vertical}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.scale label{display:grid;place-items:center;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-family:var(--f-mono);font-size:.9rem;font-variant-numeric:tabular-nums;position:relative}
.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scale label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.scaleends{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:6px}
.fields{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:24px}
.fields label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted);min-width:0}
.howto{margin-top:28px;border-top:1px solid var(--line);padding-top:20px;display:grid;gap:10px}
.howto ol{margin:0;padding-left:1.2rem;display:grid;gap:6px;max-width:62ch}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:40px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:999px;padding:12px 22px;border:1px solid var(--ink);background:transparent;color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.ghost{border-color:var(--line);color:var(--muted);font-weight:500}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* peças e looks */
.cat{margin-top:34px;display:grid;gap:12px}
.cat-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.cat-head .count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.pieces{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pieces.wide{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pieces.wide .photo{aspect-ratio:3/2}
.piece{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.piece:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.piece.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.piece .cap{padding:9px 11px;font-size:.86rem;line-height:1.35;display:flex;flex-direction:column;gap:4px}
.piece.on .cap{background:var(--accent-soft)}
.code{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;color:var(--muted)}
.photo{position:relative;aspect-ratio:3/4;max-width:100%;width:100%;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo svg{width:46%;height:auto;color:var(--muted);opacity:.7}
.photo .soon{position:absolute;left:8px;bottom:8px;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.photo .chk{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem}
.photo.sw{display:grid;grid-template-columns:3fr 2fr 1fr;place-items:stretch}
.cardbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px;padding:12px 0;border-block:1px solid var(--line)}
.tally{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{color:var(--ink);font-weight:500}
.filter{display:flex;gap:6px}
.chip{font:inherit;font-size:.82rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px}
.chip.on{border-color:var(--ink);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:20px}
.look{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.look .body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.look p{margin:0;font-size:.92rem;line-height:1.45;flex:1}
.look .pick{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.look .pick button{font:inherit;font-size:.74rem;line-height:1.2;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:7px 4px}
.look .pick button.on[data-v=sim]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.look .pick button.on[data-v=gosto]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.look .pick button.on[data-v=nao]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.look.dim{opacity:.62}
.look .pick button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* resultado */
.res-head{display:grid;gap:6px}
.signature{margin-top:20px;padding:22px 24px;border-radius:14px;background:var(--accent-soft);font-family:var(--f-display);font-size:1.35rem;line-height:1.35;font-style:italic;text-wrap:balance}
.bars{display:grid;gap:10px;margin-top:22px}
.bar{display:grid;grid-template-columns:118px 1fr 52px;gap:12px;align-items:center}
.bar .nm{font-weight:600;font-size:.95rem;display:flex;gap:8px;align-items:center;min-width:0}
.bar .track{height:14px;background:var(--line);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px}
.bar .pc{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;font-size:.9rem}
.bar.contra .nm{color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:1px 7px;color:var(--muted)}
.tag.tri{color:var(--accent)}
.section{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);display:grid;gap:12px}
.section p{margin:0;max-width:66ch}
.section ul{margin:0;padding-left:1.1rem;display:grid;gap:6px;max-width:66ch}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 16px;max-width:66ch;margin:0}
.kv dt{color:var(--muted);font-size:.88rem}
.kv dd{margin:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-weight:400;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
.quote{border-left:2px solid var(--accent);padding-left:14px;font-style:italic;max-width:66ch}
.note{font-size:.85rem;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.confirm{margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:20}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#241a22;--muted:#6c5f67;--line:#e3dadd;--accent:#8e2f4b;--accent-ink:#fff;--accent-soft:#f4e4e9;color-scheme:light}
  @page{size:A4;margin:14mm}
  body{background:#fff;padding:0;font-size:11pt}
  body::before,header.top,.actions,#confirmbox,.nav,.lock,.toast{display:none!important}
  main{padding-top:0}
  .wrap{max-width:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .section{display:block}.section>*+*{margin-top:8px!important}.eyebrow{break-after:avoid}.bar,.signature,table,.kv,.section p{break-inside:avoid}.section h3,.section p:has(>strong:only-child){break-after:avoid}
  h1{font-size:24pt}
}
.lock{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:8px;max-width:360px}
.lock label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lockrow{display:flex;gap:8px}
.lockrow input{flex:1;min-width:0}
@media (max-width:620px){
  .adj{grid-template-columns:repeat(3,1fr)}
  .adj label:nth-child(7n){border-right:1px solid var(--line)}
  .adj label:nth-child(3n){border-right:0}
  .adj label:nth-last-child(-n+7){border-bottom:1px solid var(--line)}
}
@media (max-width:560px){
  .fields{grid-template-columns:1fr}
  .bar{grid-template-columns:92px 1fr 44px;gap:8px}
  .kv{grid-template-columns:1fr}
  .scale{grid-template-columns:repeat(6,1fr)}
  .opts.tiles{grid-template-columns:1fr 1fr}
  .pieces{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brandrow">
      <div class="brand">Assinatura <i>de</i> Estilo</div>
      <div class="steplabel" id="steplabel"></div>
    </div>
    <nav class="ruler" id="ruler" aria-label="Etapas do teste"></nav>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const S = ['n','t','e','r','s','c','d'];
const NOME = {n:'Esportivo',t:'Tradicional',e:'Refinado',r:'Romântico',s:'Sexy',c:'Criativo',d:'Dramático'};

/* Fotos publicadas em img/<chave>.webp. Peças: "<categoria>-<estilo>"; looks: id do look. Sem foto, o cartão mostra um espaço reservado. */
const PHOTO = new Set(['PB-n','PB-t','PB-e','PB-r','PB-s','PB-c','PB-d','PC-n','PC-t','PC-e','PC-r','PC-s','PC-c','PC-d','E2-n','E2-t','E2-e','E2-r','E2-s','E2-c','E2-d']);

/* Paletas da pergunta E1 */

/* ---------- utilidades ---------- */
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,seed){const r=rng(hash(seed));const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function esc(s){return String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));}
function toArr(v){return Array.isArray(v)?v:(v==null||v===''?[]:[v]);}
function lista(arr){return arr.length<=1?arr.join(''):arr.slice(0,-1).join(', ')+' e '+arr.at(-1);}

/* ---------- cálculo ---------- */
function zero(){return Object.fromEntries(S.map(k=>[k,0]));}
function count(ids){const c=zero();ids.forEach(id=>{toArr(st.a[id]).forEach(v=>{const k=String(v).split('|')[0];if(S.includes(k))c[k]++;});});return c;}
function sum(c){return S.reduce((a,k)=>a+c[k],0);}
function pct(c){const t=sum(c),o={};S.forEach(k=>o[k]=t?c[k]/t*100:0);return o;}
function mix(a,b,wa){const o={};const ha=sum(a)>0,hb=sum(b)>0;S.forEach(k=>o[k]=ha&&hb?a[k]*wa+b[k]*(1-wa):ha?a[k]:hb?b[k]:0);return o;}
function rank(o){return S.slice().sort((x,y)=>o[y]-o[x]);}
function cardCount(kind,w){const c=zero();VDECK.forEach(x=>{if(st.cards[x.id]===kind)c[x.s]+=w;});return c;}
/* versões proporcionais: dividem pelo número de looks/peças disponíveis de cada estilo, para que um estilo com menos fotos não perca pontos */
function perAvail(c,av){const o=zero();S.forEach(k=>o[k]=av[k]?c[k]/av[k]:0);return o;}
function cardScore(kind,w){return perAvail(cardCount(kind,w),LOOK_AV);}
function pieceCount(){const c=zero();VCATS.forEach(cat=>toArr(st.pecas[cat.id]).forEach(code=>{const p=PIECE[code];if(p&&PHOTO.has(p.cat+'-'+p.s))c[p.s]++;}));return c;}
function pieceScore(){return perAvail(pieceCount(),PIECE_AV);}
const IDS={
  pos:ALLQ.filter(q=>q.type==='style'||q.type==='adj').map(q=>q.id),
  contra:ALLQ.filter(q=>q.type==='contra').map(q=>q.id),
  pers:['P1','P2','P3','P4','V1','V2','V3','V4','C1','C2','C3','C4'],
  est:['E1','E2','E3','E4','E5','G1','R4'],
  ident:['I2','I3','I4','I5']
};
function compute(){
  const qRaw=count(IDS.pos);
  const pRaw=pieceScore();
  const lRaw=zero();S.forEach(k=>{lRaw[k]=cardScore('sim',2)[k]+cardScore('gosto',1)[k];});
  const qP=pct(qRaw), pP=pct(pRaw), lP=pct(lRaw);
  const vis=mix(pP,lP,0.5);
  const comb=mix(qP,vis,0.5);
  const order=rank(comb);
  const triad=order.slice(0,3);
  const rej=mix(pct(count(IDS.contra)),pct(cardScore('nao',1)),0.5);
  const contra=S.slice().sort((x,y)=>(rej[y]-rej[x])||(comb[x]-comb[y])).filter(k=>!triad.includes(k))[0];
  const pers=pct(count(IDS.pers));
  const est=mix(pct(count(IDS.est)),mix(pP,pct(cardScore('sim',1)),0.5),0.5);
  const ident=pct(count(IDS.ident));
  const asp=cardCount('gosto',1), sim=cardCount('sim',1);
  const objQ=ALLQ.filter(q=>q.type!=='open'&&q.type!=='multi');
  const answered=objQ.filter(q=>toArr(st.a[q.id]).length>0).length;
  return {qP,pP,lP,comb,order,triad,rej,contra,pers,est,ident,asp,sim,pRaw,answered,totalQ:objQ.length,hasQ:sum(qRaw)>0,hasV:sum(pRaw)+sum(lRaw)>0};
}
const r0=x=>Math.round(x);
function ans(id){const q=Q[id];if(!q||!q.o)return '';return lista(toArr(st.a[id]).filter(k=>q.o[k]).map(k=>q.o[k]));}
function words(){return toArr(st.a.I5).map(x=>String(x).split('|')[1]).filter(Boolean).slice(0,3);}
function lvl(v){return v<=4?'baixa':v<=7?'moderada':'alta';}

function buildReport(R){
  const [a,b,c]=R.triad, pr=rank(R.pers), er=rank(R.est), ir=rank(R.ident);
  const w=words().map(x=>x.toLowerCase()), wtxt=w.length?lista(w):P[ir[0]].com;
  const rep={};
  rep.signature=`${NOME[a]} com toques de ${NOME[b]} e ${NOME[c]}, para comunicar ${wtxt}.`;
  rep.triad=`Seu estilo principal é ${NOME[a]} (${r0(R.comb[a])}%), que traz ${P[a].ess}. Ele se combina com ${NOME[b]} (${r0(R.comb[b])}%), que acrescenta ${P[b].ess}, e com ${NOME[c]} (${r0(R.comb[c])}%), que entra como detalhe de ${P[c].ess}.`;
  rep.contra=`Seu contra-estilo é ${NOME[R.contra]}. Elementos como ${P[R.contra].contra} tendem a gerar desconforto e a sensação de estar fantasiado. Não é uma proibição: se quiser, dá para usá-los em pequenas doses, em um acessório ou detalhe.`;
  const p1=pr[0],p2=pr[1];
  rep.pers=[`As características que parecem mais naturais a você vêm do estilo ${NOME[p1]} (${r0(R.pers[p1])}% das respostas de personalidade, valores e comportamento): ${P[p1].tr}. Seus valores centrais giram em torno de ${P[p1].val}.`];
  if(R.pers[p2]>=20) rep.pers.push(`Há também uma presença forte de ${NOME[p2]} (${r0(R.pers[p2])}%), que acrescenta ${P[p2].tr}.`);
  if(ans('V1')) rep.pers.push(`Valor que você apontou como inegociável: ${ans('V1').toLowerCase()}.`);
  if(st.a.V6) rep.persQuote=st.a.V6;
  const e1=er[0],e2=er[1];
  rep.roupa=[`Nas preferências estéticas, nas peças e nos looks, sua escolha real se concentra em ${NOME[e1]} (${r0(R.est[e1])}%) e ${NOME[e2]} (${r0(R.est[e2])}%).`];
  const simTot=sum(R.sim);
  if(simTot){const ct=rank(R.sim)[0];rep.roupa.push(`Você marcou ${simTot} looks como “sou eu”, sendo ${R.sim[ct]} do estilo ${NOME[ct]}.`);
    const qt=rank(R.qP)[0]; if(ct!==qt) rep.roupa.push(`Nos looks você se identificou mais com ${NOME[ct]} do que nas respostas escritas (${NOME[qt]}). Vale explorar essa diferença na conversa: muitas vezes a escolha visual revela o que o cliente ainda não sabe nomear.`);}
  rep.escolhas=VCATS.map(cat=>{const sel=toArr(st.pecas[cat.id]).map(code=>PIECE[code]).filter(p=>p&&PHOTO.has(p.cat+'-'+p.s));return sel.length?[cat.nm,lista(sel.map(p=>p.t.charAt(0).toLowerCase()+p.t.slice(1)))]:null;}).filter(Boolean);
  rep.pecas=[['Peças que funcionam',`${P[e1].pc}; e, de ${NOME[e2]}, ${P[e2].pc}`],['Tecidos',`${P[e1].tec}; ${P[e2].tec}`],['Cores',`${P[e1].cor}; ${P[e2].cor}`]];
  rep.ocasioes=R.triad.map(k=>`${NOME[k]}: ${P[k].oc}.`);
  rep.cuidado=`Cuidado com o excesso de ${NOME[a]}: ${P[a].exc}. Os estilos complementares equilibram esse efeito.`;
  const des=ir[0], per=toArr(st.a.I1).filter(k=>S.includes(k));
  rep.ident=[`Você deseja ser percebido a partir do estilo ${NOME[des]}, que comunica ${P[des].com}.`];
  if(ans('I2')) rep.ident.push(`À primeira vista, quer parecer: ${ans('I2').toLowerCase()}.`);
  if(per.length){
    const pn=lista(per.map(k=>NOME[k]));
    rep.ident.push(`Hoje, sente que é percebido como ${lista(per.map(k=>Q.I1.o[k].toLowerCase()))} (leitura ${pn}).`);
    rep.ident.push(per.includes(des)?'A imagem percebida e a desejada estão alinhadas. O trabalho aqui é refinar e dar mais intenção ao que já funciona.':`Há uma distância entre a imagem percebida (${pn}) e a desejada (${NOME[des]}). A estratégia de vestuário deve incorporar, de forma gradual, elementos de ${NOME[des]}: ${P[des].pc}.`);
  }
  if(w.length){const ws=toArr(st.a.I5).map(x=>String(x).split('|'));rep.ident.push(`As 3 palavras que você escolheu: ${lista(ws.map(([k,x])=>`${x.toLowerCase()} (${NOME[k]})`))}.`);}
  const aspTot=sum(R.asp);
  if(aspTot){const ak=rank(R.asp)[0];rep.ident.push(`Os looks marcados como “gosto, mas não sou eu” apontam para ${NOME[ak]} (${R.asp[ak]} de ${aspTot}). Isso pode indicar um desejo de expressão que você ainda não se permite.`);}
  const sc=['R1','R2','R3'].map(id=>st.a[id]).filter(v=>typeof v==='number');
  rep.emo=[];
  if(typeof st.a.R1==='number') rep.emo.push(['Satisfação com a imagem',`${st.a.R1}/10 · ${lvl(st.a.R1)}`]);
  if(typeof st.a.R2==='number') rep.emo.push(['Segurança ao se vestir',`${st.a.R2}/10 · ${lvl(st.a.R2)}`]);
  if(typeof st.a.R3==='number') rep.emo.push(['Imagem representa quem é',`${st.a.R3}/10 · ${lvl(st.a.R3)}`]);
  const media=sc.length?sc.reduce((x,y)=>x+y,0)/sc.length:null;
  if(media!=null) rep.emo.push(['Média emocional',`${media.toFixed(1).replace('.',',')}/10`]);
  if(toArr(st.a.R5).length) rep.emo.push(['Sentimento diante do espelho',lista(toArr(st.a.R5))]);
  if(toArr(st.a.R6).length) rep.emo.push(['Barreiras',lista(toArr(st.a.R6).map(x=>x.toLowerCase()))]);
  rep.emoTxt = media==null?'':media<=4?'A relação emocional com a própria imagem está fragilizada. Vale começar a consultoria pelo que já funciona e celebrar pequenas vitórias, antes de propor mudanças grandes.':media<=7?'A relação com a própria imagem é ambivalente: há base de confiança, mas também dúvida. Ganhos rápidos, como cores e modelagens certeiras, tendem a elevar essas notas.':'A relação com a própria imagem é positiva. O foco pode ser refinamento, coerência e expansão de repertório.';
  rep.quotes=[['Diferença entre a imagem atual e a desejada',st.a.I6],['O que deseja usar, mas não se permite',st.a.R7]].filter(x=>x[1]);
  return rep;
}

function renderResult(){
  const R=compute();
  if(!R.hasQ&&!R.hasV) return `<div class="eyebrow">Resultado</div><h2>Ainda não há respostas suficientes</h2><p class="lead" style="margin-top:8px">Responda os blocos de perguntas, as peças e os looks para gerar a tríade de estilo e a devolutiva.</p><div class="nav"><button class="btn primary" type="button" data-go="1">Ir para as perguntas</button></div>`;
  const rep=buildReport(R);
  const nome=st.info.nome?esc(st.info.nome):'Cliente';
  const dt=st.info.data?new Date(st.info.data+'T12:00:00').toLocaleDateString('pt-BR'):'';
  const bars=R.order.map((k,i)=>{const isT=i<3,isC=k===R.contra;return `<div class="bar ${isC?'contra':''}"><div class="nm"><span>${NOME[k]}</span>${isT?`<span class="tag tri">${i+1}º</span>`:''}${isC?'<span class="tag">contra</span>':''}</div><div class="track"><div class="fill" style="width:${R.comb[k].toFixed(1)}%;background:var(--st-${k});opacity:${isC?.45:1}"></div></div><div class="pc">${r0(R.comb[k])}%</div></div>`;}).join('');
  const rows=S.map(k=>`<tr><td>${NOME[k]}</td><td class="n">${r0(R.qP[k])}%</td><td class="n">${r0(R.pP[k])}%</td><td class="n">${r0(R.lP[k])}%</td><td class="n">${r0(R.comb[k])}%</td><td class="n">${r0(R.rej[k])}%</td></tr>`).join('');
  const missing=R.totalQ-R.answered, looksLeft=VDECK.filter(c=>!st.cards[c.id]).length, catsLeft=VCATS.filter(c=>!toArr(st.pecas[c.id]).length).length;
  const gaps=[missing>0?`${missing} pergunta(s) objetiva(s)`:'',catsLeft>0?`${catsLeft} categoria(s) de peças`:'',looksLeft>0?`${looksLeft} look(s)`:''].filter(Boolean);
  return `<div class="res-head"><div class="eyebrow">Resultado · ${nome}${dt?' · '+dt:''}</div><h1>Tríade: <em>${NOME[R.triad[0]]}</em>, ${NOME[R.triad[1]]} e ${NOME[R.triad[2]]}</h1></div>
  ${gaps.length?`<p class="note">Sem resposta: ${lista(gaps)}. O resultado considera apenas o que foi respondido.</p>`:''}
  <div class="signature">${esc(rep.signature)}</div>
  <div class="bars" role="list" aria-label="Distribuição dos estilos">${bars}</div>
  <p class="note" style="margin-top:10px">Peso: 50% questionário e 50% etapa visual (metade peças, metade looks). Contra-estilo: maior rejeição fora da tríade.</p>

  <div class="section"><h3>Tríade e contra-estilo</h3><p>${esc(rep.triad)}</p><p>${esc(rep.contra)}</p></div>

  <div class="section"><div class="eyebrow">Devolutiva 1</div><h3>Personalidade</h3>${rep.pers.map(x=>`<p>${esc(x)}</p>`).join('')}${rep.persQuote?`<p class="quote">O que é mais importante na sua vida hoje: ${esc(rep.persQuote)}</p>`:''}</div>

  <div class="section"><div class="eyebrow">Devolutiva 2</div><h3>Roupas e ocasiões</h3>${rep.roupa.map(x=>`<p>${esc(x)}</p>`).join('')}
  ${rep.escolhas.length?`<p><strong>Peças escolhidas</strong></p><dl class="kv">${rep.escolhas.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`:''}
  <p><strong>Direção para o guarda-roupa</strong></p><dl class="kv">${rep.pecas.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
  <p><strong>Ocasiões para cada estilo da tríade</strong></p><ul>${rep.ocasioes.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="note">${esc(rep.cuidado)}</p></div>

  <div class="section"><div class="eyebrow">Devolutiva 3</div><h3>Identidade e percepção</h3>${rep.ident.map(x=>`<p>${esc(x)}</p>`).join('')}
  ${rep.emo.length?`<p><strong>Relação emocional com a própria imagem</strong></p><dl class="kv">${rep.emo.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><p>${esc(rep.emoTxt)}</p>`:''}
  ${rep.quotes.map(([k,v])=>`<p class="quote">${esc(k)}: ${esc(v)}</p>`).join('')}</div>

  <div class="section"><div class="eyebrow">Visão da consultora</div><h3>Pontuação por fonte</h3>
  <div class="tablewrap"><table><thead><tr><th>Estilo</th><th class="n">Questionário</th><th class="n">Peças</th><th class="n">Looks</th><th class="n">Final</th><th class="n">Rejeição</th></tr></thead><tbody>${rows}</tbody></table></div></div>

  <div class="actions"><button class="btn primary" type="button" data-act="pdf">Baixar PDF</button><button class="btn" type="button" data-act="copy">Copiar resultado</button><button class="btn" type="button" data-go="1">Revisar respostas</button><button class="btn ghost" type="button" data-act="reset">Novo teste</button></div>
  <div id="confirmbox"></div>`;
}
function reportText(){
  const R=compute(), rep=buildReport(R);
  const L=[];
  L.push(`ASSINATURA DE ESTILO · ${st.info.nome||'Cliente'}${st.info.data?' · '+new Date(st.info.data+'T12:00:00').toLocaleDateString('pt-BR'):''}`,'');
  L.push(`Tríade: ${R.triad.map(k=>`${NOME[k]} ${r0(R.comb[k])}%`).join(' · ')}`);
  L.push(`Contra-estilo: ${NOME[R.contra]}`,'');
  L.push(`Assinatura: ${rep.signature}`,'');
  L.push('Distribuição: '+R.order.map(k=>`${NOME[k]} ${r0(R.comb[k])}%`).join(' | '),'');
  L.push(rep.triad,rep.contra,'');
  L.push('1. PERSONALIDADE',...rep.pers);if(rep.persQuote)L.push(`Mais importante hoje: ${rep.persQuote}`);L.push('');
  L.push('2. ROUPAS E OCASIÕES',...rep.roupa);
  if(rep.escolhas.length)L.push('Peças escolhidas:',...rep.escolhas.map(([k,v])=>`- ${k}: ${v}`));
  L.push(...rep.pecas.map(([k,v])=>`${k}: ${v}`),'Ocasiões:',...rep.ocasioes.map(x=>'- '+x),rep.cuidado,'');
  L.push('3. IDENTIDADE E PERCEPÇÃO',...rep.ident,...rep.emo.map(([k,v])=>`${k}: ${v}`));if(rep.emoTxt)L.push(rep.emoTxt);rep.quotes.forEach(([k,v])=>L.push(`${k}: ${v}`));
  return L.join('\n');
}

/* ---------- eventos ---------- */
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200);}
function go(i){UNLOCK=false;st.step=Math.max(0,Math.min(STEPS.length-1,i));save();render();window.scrollTo({top:0,behavior:'instant'});}
function keepScroll(fn){const y=window.scrollY;fn();render();window.scrollTo(0,y);}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]'); if(g){go(+g.dataset.go);return;}
  const a=e.target.closest('[data-act]');
  if(a){const act=a.dataset.act;
    if(act==='next')go(st.step+1);
    if(act==='prev')go(st.step-1);
    if(act==='copy'){const txt=reportText();
      const fallback=()=>{const box=document.getElementById('confirmbox');box.innerHTML=`<div class="confirm" style="display:block"><p class="note" style="margin:0 0 8px">Selecione e copie o texto abaixo.</p><textarea id="copytxt" style="min-height:240px">${esc(txt)}</textarea></div>`;const ta=document.getElementById('copytxt');ta.focus();ta.select();};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Resultado copiado'),fallback);}catch(err){fallback();}}
    if(act==='reset'){document.getElementById('confirmbox').innerHTML=`<div class="confirm"><span>Apagar todas as respostas deste navegador e começar um novo teste?</span><button class="btn primary" type="button" data-act="reset-yes">Apagar e recomeçar</button><button class="btn ghost" type="button" data-act="reset-no">Cancelar</button></div>`;}
    if(act==='reset-no')document.getElementById('confirmbox').innerHTML='';
    if(act==='reset-yes'){UNLOCK=false;st={step:0,info:{nome:'',data:''},a:{},cards:{},pecas:{},filter:'todos'};save();render();toast('Novo teste iniciado');}
    return;}
  const f=e.target.closest('[data-filter]'); if(f){st.filter=f.dataset.filter;save();render();return;}
  const p=e.target.closest('[data-piece]');
  if(p){const code=p.dataset.piece,cat=PIECE[code].cat,sel=toArr(st.pecas[cat]);
    if(sel.includes(code)) st.pecas[cat]=sel.filter(x=>x!==code);
    else if(sel.length>=2){toast('Escolha no máximo 2 peças por categoria');return;}
    else st.pecas[cat]=[...sel,code];
    save();keepScroll(()=>{});return;}
  const c=e.target.closest('[data-card]');
  if(c){const id=c.dataset.card,v=c.dataset.v;if(st.cards[id]===v)delete st.cards[id];else st.cards[id]=v;save();keepScroll(()=>{});}
});
document.addEventListener('change',e=>{
  const el=e.target; const q=Q[el.name]; if(!q)return;
  if(q.type==='scale')st.a[q.id]=+el.value;
  else{
    const arr=toArr(st.a[q.id]);
    const max=q.type==='adj'?3:LIM.includes(q.type)?2:Infinity;
    if(el.checked&&arr.length>=max){el.checked=false;toast(q.type==='adj'?'Escolha exatamente 3 palavras':'Escolha no máximo 2 alternativas');return;}
    st.a[q.id]=el.checked?[...arr,el.value]:arr.filter(x=>x!==el.value);
  }
  save();
  el.closest('fieldset').querySelectorAll('label').forEach(l=>{const i=l.querySelector('input');l.classList.toggle('on',i.checked);});
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.info){st.info[el.dataset.info]=el.value;save();}
  if(el.dataset.open){st.a[el.dataset.open]=el.value;save();}
});
render();
</script>
